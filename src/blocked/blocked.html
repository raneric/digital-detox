<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Site blocked — Digital Detox</title>
  <link rel="stylesheet" href="blocked.css" />
</head>
<body>
  <main>
    <h1>Time's up for today 🌿</h1>
    <p class="lead">
      You've reached your daily limit on
      <span class="domain" id="domain">this site</span>.
      It stays blocked until tomorrow. Come back refreshed.
    </p>

    <!-- Learning card: hidden until a card is successfully loaded,
         so the static message always stands on its own. -->
    <p id="card-intro" class="card-intro" hidden>
      ✨ While you're here, here's something worth reading
    </p>
    <section id="card" class="card" hidden>
      <div class="card-top">
        <span id="card-badge" class="badge"></span>
        <span id="card-source" class="source"></span>
      </div>
      <h2 id="card-title"></h2>
      <p id="card-blurb"></p>
      <div class="card-actions">
        <a id="card-link" class="card-link primary" target="_blank"
          rel="noopener noreferrer">Read the article ↗</a
        >
        <button id="not-for-me" class="ghost" type="button">
          Not for me
        </button>
        <button id="another" class="ghost" type="button">
          Show me another
        </button>
      </div>
    </section>
  </main>
  <script type="module" src="blocked.js"></script>
</body>
</html>
