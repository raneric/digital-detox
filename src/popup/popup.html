<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>ReelRest</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <h1><span class="logo">🛡️</span> ReelRest</h1>
      <button
        id="reset-all"
        class="ghost danger-ghost"
        title="Clear all recorded usage"
      >
        Reset usage
      </button>
    </header>

    <!-- Options mode only: personalization of the block-page learning cards. -->
    <section id="topics-section" hidden>
      <h2 class="section-title">Learning card topics</h2>
      <p class="hint">Choose what to read when a site is blocked.</p>
      <div id="topics-list" class="topics"></div>
    </section>

    <form id="add-form">
      <input
        id="new-domain"
        type="text"
        placeholder="example.com"
        required
        pattern="^([a-z0-9-]+\.)+[a-z]{2,}$"
        autocomplete="off"
      />
      <input
        id="new-limit"
        type="number"
        min="0"
        max="1440"
        value="30"
        required
        title="Limit in minutes"
      />
      <button type="submit" class="primary">Add</button>
    </form>

    <p class="hint">Daily time limit per site, in minutes. 0 = no limit.</p>

    <ul id="site-list" aria-label="Configured sites"></ul>

    <p id="empty-state" class="hint empty" hidden>
      No sites yet. Add one below to start tracking.
    </p>

    <footer class="options-link">
      <!-- Only visible in popup mode: destructive actions live in the options page. -->
      <a href="popup.html?view=options" id="open-options" target="_blank"
        >Manage / reset sites ↗</a
      >
      <span id="options-badge">Options page</span>
    </footer>

    <template id="site-row">
      <li class="site-row">
        <div class="row-top">
          <label class="site-name"></label>
          <span class="usage"></span>
        </div>
        <div class="progress" role="presentation">
          <div class="progress-fill"></div>
        </div>
        <div class="controls">
          <!-- Popup mode: limit is read-only info. Options mode: editable. -->
          <span class="limit-label"></span>
          <input
            class="limit"
            type="number"
            min="0"
            max="1440"
            aria-label="Limit in minutes"
          />
          <span class="unit">min / day</span>
          <span class="spacer"></span>
          <button
            class="reset ghost danger-ghost"
            title="Reset today's usage for this site"
          >
            ↺ Reset
          </button>
          <button class="remove ghost danger-ghost" title="Remove this site">
            ✕ Remove
          </button>
        </div>
      </li>
    </template>

    <dialog id="confirm-dialog">
      <p class="dialog-text"></p>
      <div class="dialog-actions">
        <button class="confirm-no">Cancel</button>
        <button class="confirm-yes primary">Yes, do it</button>
      </div>
    </dialog>

    <script src="popup.js" type="module"></script>
  </body>
</html>
