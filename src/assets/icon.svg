<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Background -->
  <rect x="4" y="4" width="120" height="120" rx="30" fill="#FFE066"/>
  
  <!-- Phone body -->
  <rect x="40" y="22" width="48" height="84" rx="12" fill="#2D3436"/>
  
  <!-- Screen -->
  <rect x="46" y="32" width="36" height="60" rx="4" fill="#74C0FC"/>
  
  <!-- Speaker -->
  <rect x="58" y="26" width="12" height="3" rx="1.5" fill="#636E72"/>
  
  <!-- Sleepy eyes (closed, curved down) -->
  <path d="M52 54 Q58 60 64 54" stroke="#2D3436" stroke-width="4" 
        fill="none" stroke-linecap="round"/>
  <path d="M68 54 Q74 60 80 54" stroke="#2D3436" stroke-width="4" 
        fill="none" stroke-linecap="round"/>
  
  <!-- Little smile -->
  <path d="M60 70 Q66 76 72 70" stroke="#2D3436" stroke-width="3.5" 
        fill="none" stroke-linecap="round"/>
  
  <!-- Blush cheeks -->
  <circle cx="50" cy="66" r="4" fill="#FF6B9D"/>
  <circle cx="82" cy="66" r="4" fill="#FF6B9D"/>
  
  <!-- Z's floating -->
  <text x="88" y="30" font-family="Arial Black, sans-serif" font-size="16" 
        font-weight="900" fill="#2D3436">z</text>
  <text x="98" y="20" font-family="Arial Black, sans-serif" font-size="22" 
        font-weight="900" fill="#2D3436">z</text>
</svg>